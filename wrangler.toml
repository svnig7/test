name = "auto-caption-bot"
main = "src/index.js"
compatibility_date = "2024-11-01"

[[kv_namespaces]]
binding = "CAPTION_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# Set these with `wrangler secret put <NAME>` — do not put them here:
#   BOT_TOKEN       — from @BotFather
#   WEBHOOK_SECRET  — any random string, used to authenticate /webhook and /set-webhook
#   ADMIN_IDS       — comma-separated Telegram user IDs allowed to configure the bot
